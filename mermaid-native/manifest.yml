modules:
  jira:issuePanel:
    - key: mermaid-issue-panel
      resource: main-custom-ui
      resolver:
        function: resolver
      title: Mermaid Diagrams
      icon: icon.png

  function:
    - key: resolver
      handler: resolvers/index.handler

resources:
  - key: main-custom-ui
    path: static/main-custom-ui/build

app:
  runtime:
    name: nodejs22.x
  # This id is tied to one specific Atlassian account's app registration.
  # If you cloned this repo, it isn't yours to deploy to — run
  # `forge register` (see README.md); it overwrites this id with a fresh
  # one registered under your own account.
  id: ari:cloud:ecosystem::app/1ab8c5cd-15fc-42de-9b72-6012c1356988

permissions:
  scopes:
    # Narrower than read:jira-work/write:jira-work: the resolver only ever
    # GETs/PUTs the mermaid-diagram-board issue entity property — it never
    # searches issues, creates/deletes issues, or touches comments/worklogs,
    # all of which the classic scopes also grant. Verified against
    # https://developer.atlassian.com/cloud/jira/platform/scopes-for-oauth-2-3LO-and-forge-apps/
    - read:issue.property:jira
    - write:issue.property:jira
