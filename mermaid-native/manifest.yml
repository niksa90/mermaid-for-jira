modules:
  jira:issuePanel:
    - key: mermaid-issue-panel
      resource: main-custom-ui
      resolver:
        function: resolver
      title: Mermaid Diagrams
      icon: icon.png

  function:
    - key: resolver
      handler: resolvers/index.handler

resources:
  - key: main-custom-ui
    path: static/main-custom-ui/build

app:
  runtime:
    name: nodejs22.x
  # This id is tied to one specific Atlassian account's app registration.
  # If you cloned this repo, it isn't yours to deploy to — run
  # `forge register` (see README.md); it overwrites this id with a fresh
  # one registered under your own account.
  id: ari:cloud:ecosystem::app/1ab8c5cd-15fc-42de-9b72-6012c1356988

permissions:
  scopes:
    # Narrower than read:jira-work/write:jira-work: the resolver only ever
    # GETs/PUTs the mermaid-diagram-board issue entity property — it never
    # searches issues, creates/deletes issues, or touches comments/worklogs,
    # all of which the classic scopes also grant. Verified against
    # https://developer.atlassian.com/cloud/jira/platform/scopes-for-oauth-2-3LO-and-forge-apps/
    - read:issue.property:jira
    - write:issue.property:jira
  content:
    # Opts this Custom UI iframe's CSP into inline <style>/style="..." —
    # without this, real editor libraries (CodeMirror/Monaco) can't render
    # at all (both position cursor/selection via inline style), which is
    # the whole reason this app has hand-rolled every UI component and
    # baked Mermaid's own theming into SVG presentation attributes instead
    # of letting its <style> block through as-is (see CLAUDE.md's CSP
    # section). Deliberate trade-off, confirmed with the user: this makes
    # the app ineligible for the "Runs on Atlassian" Marketplace badge
    # (https://developer.atlassian.com/platform/marketplace/runs-on-atlassian/),
    # which only matters for Marketplace-listed apps — this one isn't
    # listed, so it costs nothing today. Residual risk this widens: any
    # Mermaid diagram source is written by the same Jira users who view it
    # (no third-party/anonymous diagram authorship in this app), Mermaid
    # runs with securityLevel:'strict' + its own DOMPurify sanitization
    # regardless, and this permission only affects style-src, not
    # script-src — so it doesn't reopen inline-script execution.
    styles:
      - 'unsafe-inline'
