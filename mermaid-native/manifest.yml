modules:
  jira:issuePanel:
    - key: mermaid-issue-panel
      resource: main-custom-ui
      resolver:
        function: resolver
      title: Mermaid Diagrams
      icon: icon.svg

  function:
    - key: resolver
      handler: resolvers/index.handler

resources:
  - key: main-custom-ui
    path: static/main-custom-ui/build

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/c3e3a610-cf43-41cd-a79e-c4867aa9f0a4

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
